# > ssh-to-age < ~/.ssh/id_ed25519.pub
# or
# > nix run nixpkgs#ssh-to-age -- < ~/.ssh/id_ed25519.pub
keys:
  - &jetpure age13qxl594a6jvt5dku8clyga2c3dxap6jur86zwleedylt7ht0fymsvpkyum

creation_rules:
  # allow to create any
  # (yaml | json | env | ini) file
  # in ./secrets/<name>.ext

  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *jetpure

  # allows to create .<name>.ext
  - path_regex: .[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *jetpure
